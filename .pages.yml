actions:
  - name: publish-approved-site
    label: Publicar alterações aprovadas
    workflow: pages-cms-publish.yml
    ref: current
    cancelable: false
    confirm:
      title: Publicar no site?
      message: Esta ação enviará todo o conteúdo aprovado para a versão pública e iniciará um único deploy no Render.
      button: Publicar agora

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: "Atualiza conteúdo do site pelo painel"
      create: "Adiciona conteúdo pelo painel"
      delete: "Remove conteúdo pelo painel"
      rename: "Renomeia conteúdo pelo painel"
