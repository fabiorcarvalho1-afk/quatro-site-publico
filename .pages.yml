          - name: aria_label
            label: Descrição acessível da mídia
            type: string
            required: true
          - name: media_type
            label: Tipo de mídia principal
            type: select
            required: true
            options:
              values:
                - name: video
                  label: Vídeo
                - name: image
                  label: Imagem
          - name: poster
            label: Imagem ou capa do vídeo
            type: image
            required: true
            options:
              media: images
          - name: video
            label: Vídeo principal
            type: file
            options:
              media: videos
              extensions: [mp4, webm]
          - name: fallback_video
            label: Vídeo alternativo
            type: file
            options:
              media: videos
              extensions: [mp4, webm]
          - name: fallback_images
            label: Imagens de segurança
            type: image
            list:
              min: 1
              max: 5
            options:
              media: images
          - name: words
            label: Palavras em destaque
            type: string
            list:
              min: 3
              max: 3
          - name: statement
            label: Frase principal
            type: string
            required: true
          - name: hashtags
            label: Hashtags
            type: string
            list:
              min: 3
              max: 3
          - name: buttons
            label: Botões
            component: button
            list:
              min: 4
              max: 4
              collapsible:
                collapsed: true
                summary: "{label}"

      - name: intent
        label: Escolha seu caminho
        type: object
