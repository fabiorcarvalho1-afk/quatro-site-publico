      - name: label
        label: Texto
        type: string
        required: true
      - name: href
        label: Link
        type: string
        required: true

  text_card:
    type: object
    fields:
      - name: label
        label: Categoria
        type: string
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: text
        required: true

  linked_card:
    type: object
    fields:
      - name: label
        label: Categoria
        type: string
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: text
        required: true
      - name: cta
        label: Texto do botão
        type: string
        required: true
      - name: href
        label: Link
        type: string
        required: true

  image_linked_card:
    type: object
    fields:
      - name: category
        label: Categoria
        type: string
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: text
        required: true
      - name: cta
        label: Texto do botão
